name: Custom Template Workflow
on:
  workflow_dispatch:
  pull_request:
jobs:
  CustomJob-TemplateInit:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Echo init text
        run: Write-Host 'custom template init unique text'
  CustomJob-TemplateDeploy:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Echo deploy text
        run: Write-Host 'custom template deploy unique text'
